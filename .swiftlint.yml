included:
  - Apps
  - Sources
  - Tests

excluded:
  - .build
  - LocalTodo.xcodeproj

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - prefer_self_in_static_references
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 300
  error: 450

function_body_length:
  warning: 40
  error: 60

type_body_length:
  warning: 200
  error: 300

cyclomatic_complexity:
  warning: 10
  error: 15

trailing_comma:
  mandatory_comma: true

identifier_name:
  min_length: 2
  excluded:
    - id

reporter: xcode
