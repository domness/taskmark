name: LocalTodo

options:
  xcodeVersion: "27.0"
  bundleIdPrefix: com.domness
  fileTypes:
    icon:
      file: true
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  LocalTodoKit:
    path: .
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.5.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  TaskmarkCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/LocalTodoCLI
    dependencies:
      - package: LocalTodoKit
        product: LocalTodoDomain
      - package: LocalTodoKit
        product: LocalTodoMarkdown
      - package: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: taskmark
        PRODUCT_MODULE_NAME: LocalTodoCLI
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
  LocalTodoApp:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    info:
      path: .build/Taskmark-Info.plist
      properties:
        ATSApplicationFontsPath: Fonts
        SUFeedURL: https://github.com/domness/taskmark/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.domness.localtodo.task-reference
            UTTypeDescription: Taskmark Task Reference
            UTTypeConformsTo:
              - public.data
    sources:
      - path: Apps/LocalTodoApp/Sources
      - path: Apps/LocalTodoApp/Resources
        excludes:
          - Fonts
      - path: Apps/LocalTodoApp/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - target: TaskmarkCLI
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: LocalTodoKit
        product: LocalTodoDomain
      - package: LocalTodoKit
        product: LocalTodoMarkdown
      - package: Sparkle
      - package: LocalTodoKit
        product: LocalTodoWorkspace
      - package: LocalTodoKit
        product: LocalTodoPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinycorestudios.taskmark
        PRODUCT_NAME: Taskmark
        MARKETING_VERSION: 0.14.0
        CURRENT_PROJECT_VERSION: 21
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: LocalTodoApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taskmark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Apps/LocalTodoApp/LocalTodoApp.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
  LocalTodoAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Apps/LocalTodoApp/Tests
    dependencies:
      - target: LocalTodoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domness.localtodo.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Taskmark.app/Contents/MacOS/Taskmark"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LocalTodoIOSApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    info:
      path: .build/Taskmark-iOS-Info.plist
      properties:
        UIAppFonts:
          - Fonts/Inter.ttf
          - Fonts/Inter-Italic.ttf
          - Fonts/Figtree.ttf
          - Fonts/Figtree-Italic.ttf
        LSSupportsOpeningDocumentsInPlace: true
    sources:
      - path: Apps/LocalTodoIOSApp/Sources
      - path: Apps/LocalTodoIOSApp/Resources/AppIcon.icon
        buildPhase: resources
      - path: Apps/LocalTodoApp/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: LocalTodoKit
        product: LocalTodoDomain
      - package: LocalTodoKit
        product: LocalTodoMarkdown
      - package: LocalTodoKit
        product: LocalTodoWorkspace
      - package: LocalTodoKit
        product: LocalTodoPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinycorestudios.taskmark
        PRODUCT_NAME: Taskmark
        MARKETING_VERSION: 0.12.0
        CURRENT_PROJECT_VERSION: 18
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: LocalTodoIOSApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taskmark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  LocalTodoIOSAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Apps/LocalTodoIOSApp/Tests
      - path: Tests/LocalTodoDomainTests
      - path: Tests/LocalTodoMarkdownTests
        excludes:
          - Fixtures
      - path: Tests/LocalTodoMarkdownTests/Fixtures
        buildPhase: resources
      - path: Tests/LocalTodoWorkspaceTests
      - path: Tests/LocalTodoPresentationTests
    dependencies:
      - target: LocalTodoIOSApp
      - package: LocalTodoKit
        product: LocalTodoDomain
      - package: LocalTodoKit
        product: LocalTodoMarkdown
      - package: LocalTodoKit
        product: LocalTodoWorkspace
      - package: LocalTodoKit
        product: LocalTodoPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domness.localtodo.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Taskmark.app/Taskmark"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LocalTodoIOSAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Apps/LocalTodoIOSApp/UITests
    dependencies:
      - target: LocalTodoIOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domness.localtodo.ios.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LocalTodoApp:
    build:
      targets:
        LocalTodoApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LocalTodoAppTests
    archive:
      config: Release
  LocalTodoIOSApp:
    build:
      targets:
        LocalTodoIOSApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LocalTodoIOSAppTests
        - LocalTodoIOSAppUITests
    archive:
      config: Release
