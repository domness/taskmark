name: LocalTodo

options:
  bundleIdPrefix: com.domness
  deploymentTarget:
    macOS: "15.0"

packages:
  LocalTodoKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  LocalTodoApp:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Apps/LocalTodoApp/Sources
    dependencies:
      - package: LocalTodoKit
        product: LocalTodoDomain
      - package: LocalTodoKit
        product: LocalTodoMarkdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domness.localtodo
        PRODUCT_NAME: Local Todo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Local Todo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Automatic

schemes:
  LocalTodoApp:
    build:
      targets:
        LocalTodoApp: all
    run:
      config: Debug
    archive:
      config: Release
