name: LocalTodo

options:
  bundleIdPrefix: com.domness
  deploymentTarget:
    macOS: "15.0"

packages:
  LocalTodoKit:
    path: .
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.5.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TaskmarkCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/LocalTodoCLI
    dependencies:
      - package: LocalTodoKit
        product: LocalTodoDomain
      - package: LocalTodoKit
        product: LocalTodoMarkdown
      - package: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: taskmark
        PRODUCT_MODULE_NAME: LocalTodoCLI
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
  LocalTodoApp:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Apps/LocalTodoApp/Sources
      - path: Apps/LocalTodoApp/Resources
    dependencies:
      - target: TaskmarkCLI
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: LocalTodoKit
        product: LocalTodoDomain
      - package: LocalTodoKit
        product: LocalTodoMarkdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domness.localtodo
        PRODUCT_NAME: Taskmark
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: LocalTodoApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taskmark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Apps/LocalTodoApp/LocalTodoApp.entitlements
  LocalTodoAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Apps/LocalTodoApp/Tests
    dependencies:
      - target: LocalTodoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domness.localtodo.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Taskmark.app/Contents/MacOS/Taskmark"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LocalTodoApp:
    build:
      targets:
        LocalTodoApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LocalTodoAppTests
    archive:
      config: Release
