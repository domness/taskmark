name: Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/validate-commit-range "$BASE_SHA" "$HEAD_SHA"

  platform:
    name: ${{ matrix.lane }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [macOS, iPhone, iPad]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LANE: ${{ matrix.lane }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Add Homebrew tools to PATH
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Install quality tools
        if: matrix.lane == 'macOS'
        run: |
          brew install swiftlint xcodegen
          bash scripts/install-ci-swiftformat
      - name: Install simulator build tools
        if: matrix.lane != 'macOS'
        run: brew install xcodegen
      - name: Check Mac toolchain
        if: matrix.lane == 'macOS'
        run: bash scripts/check-macos-runner
      - name: Check simulator toolchain
        if: matrix.lane != 'macOS'
        run: |
          xcodebuild -version
          xcodegen --version
          xcrun simctl list devices available
      - name: Create validation results directory
        run: |
          output="$RUNNER_TEMP/local-todo-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$LANE"
          mkdir -p "$output"
          echo "OUTPUT_DIR=$output" >> "$GITHUB_ENV"
      - name: Lint and test release scripts
        if: matrix.lane == 'macOS'
        run: make lint test-release-scripts 2>&1 | tee "$OUTPUT_DIR/lint-and-scripts.log"
      - name: Run Swift package tests
        if: matrix.lane == 'macOS'
        run: make test-unit 2>&1 | tee "$OUTPUT_DIR/unit.log"
      - name: Run macOS app tests and Debug build
        if: matrix.lane == 'macOS'
        run: |
          make test-macos build \
            XCODEBUILD_ARGS="-destination 'platform=macOS' -derivedDataPath '$OUTPUT_DIR/DerivedData'" \
            XCODE_TEST_ARGS="-resultBundlePath '$OUTPUT_DIR/LocalTodoApp.xcresult'" \
            2>&1 | tee "$OUTPUT_DIR/macos.log"
      - name: Run iOS hosted tests
        if: matrix.lane == 'iPhone'
        run: make test-ios-unit IOS_TEST_RESULT_DIR="$OUTPUT_DIR" 2>&1 | tee "$OUTPUT_DIR/ios-unit.log"
      - name: Run iPhone UI tests and iOS Debug build
        if: matrix.lane == 'iPhone'
        run: make test-ios-phone build-ios IOS_TEST_RESULT_DIR="$OUTPUT_DIR" 2>&1 | tee "$OUTPUT_DIR/iphone.log"
      - name: Run iPad UI tests
        if: matrix.lane == 'iPad'
        run: make test-ios-tablet IOS_TEST_RESULT_DIR="$OUTPUT_DIR" 2>&1 | tee "$OUTPUT_DIR/ipad.log"
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-todo-quality-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: |
            ${{ env.OUTPUT_DIR }}/*.log
            ${{ env.OUTPUT_DIR }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  swift:
    runs-on: ubuntu-latest
    needs: platform
    if: always()
    steps:
      - name: Require all platform lanes to pass
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          if [[ "$PLATFORM_RESULT" != success ]]; then
            echo "::error::Platform quality checks did not all pass ($PLATFORM_RESULT)."
            exit 1
          fi
