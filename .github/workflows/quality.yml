name: Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/validate-commit-range "$BASE_SHA" "$HEAD_SHA"

  swift:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Add Homebrew tools to PATH
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Install quality tools
        run: brew install swiftformat swiftlint xcodegen
      - name: Check Mac toolchain
        run: bash scripts/check-macos-runner
      - name: Run full quality gate
        run: |
          output="$RUNNER_TEMP/local-todo-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          make check \
            XCODEBUILD_ARGS="-destination 'platform=macOS' -derivedDataPath '$output/DerivedData'" \
            XCODE_TEST_ARGS="-resultBundlePath '$output/LocalTodoApp.xcresult'" \
            2>&1 | tee "$output/check.log"
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-todo-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/local-todo-quality-${{ github.run_id }}-${{ github.run_attempt }}/check.log
            ${{ runner.temp }}/local-todo-quality-${{ github.run_id }}-${{ github.run_attempt }}/LocalTodoApp.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean this run's build products
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/local-todo-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
